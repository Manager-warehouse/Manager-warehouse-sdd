openapi: 3.0.3
info:
  title: API WMS Điều chuyển nội bộ giữa kho
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /transfer-requests/stock-lookup:
    get:
      summary: Tra cứu tồn khả dụng liên kho dạng chỉ đọc
      tags: [Tồn kho]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
            format: int64
        - name: sku
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Kết quả tồn khả dụng liên kho
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrossWarehouseStockResponse'
        '403':
          description: Không được xem tồn liên kho
  /transfer-requests:
    post:
      summary: Trưởng kho tạo yêu cầu điều chuyển từ tồn kho khác
      tags: [Yêu cầu điều chuyển]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequestCreateRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '400':
          description: Lỗi validation
        '403':
          description: Kho yêu cầu nằm ngoài phạm vi của quản lý
        '422':
          description: Kho/sản phẩm không hợp lệ hoặc số lượng yêu cầu vượt tồn nguồn
  /transfer-requests/{id}:
    put:
      summary: Trưởng kho sửa yêu cầu điều chuyển DRAFT
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequestCreateRequest'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '409':
          description: Không được cập nhật yêu cầu
  /transfer-requests/{id}/submit:
    post:
      summary: Gửi yêu cầu điều chuyển cho CEO
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      responses:
        '200':
          description: Đã gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
  /transfer-requests/{id}/cancel:
    post:
      summary: Trưởng kho soft-cancel yêu cầu điều chuyển DRAFT
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '409':
          description: Yêu cầu không còn DRAFT hoặc actor không được hủy
  /transfer-requests/{id}/approve:
    post:
      summary: CEO duyệt yêu cầu điều chuyển và gửi mẫu cho Planner nguồn
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      responses:
        '200':
          description: Đã duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '409':
          description: Không được duyệt
  /transfer-requests/{id}/reject:
    post:
      summary: CEO từ chối yêu cầu điều chuyển
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeoRejectTransferRequest'
      responses:
        '200':
          description: Đã từ chối
        '400':
          description: Bắt buộc có lý do từ chối
  /transfer-requests/{id}/convert:
    post:
      summary: Planner convert yêu cầu đã duyệt thành TRF
      tags: [Yêu cầu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferRequestId'
      responses:
        '200':
          description: Yêu cầu điều chuyển đã convert và link tới một TRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '409':
          description: Yêu cầu chưa được duyệt hoặc đã convert
  /inter-warehouse-transfers:
    post:
      summary: Tạo phiếu điều chuyển từ lệnh ngoài
      tags: [Phiếu điều chuyển]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreateRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Lỗi validation
        '409':
          description: Trùng lệnh ngoài đang hoạt động hoặc kỳ kế toán đã đóng
  /inter-warehouse-transfers/{id}:
    get:
      summary: Lấy chi tiết phiếu điều chuyển
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Chi tiết phiếu điều chuyển
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
    put:
      summary: Cập nhật phiếu NEW
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUpdateRequest'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '409':
          description: Không được cập nhật phiếu
  /inter-warehouse-transfers/{id}/cancel:
    post:
      summary: Hủy phiếu NEW hoặc APPROVED chưa ship
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          description: Đã hủy
        '409':
          description: Không được hủy
  /inter-warehouse-transfers/{id}/approve:
    post:
      summary: Quản lý kho nguồn duyệt phiếu và giữ hàng
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Đã duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
  /inter-warehouse-transfers/{id}/reject:
    post:
      summary: Quản lý kho nguồn từ chối phiếu NEW
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTransferRequest'
      responses:
        '200':
          description: Đã từ chối
  /inter-warehouse-transfers/{id}/trip:
    post:
      summary: Dispatcher gán chuyến điều chuyển riêng
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTripRequest'
      responses:
        '200':
          description: Đã gán chuyến
  /inter-warehouse-transfers/{id}/outbound-qc:
    post:
      summary: Thủ kho nguồn ghi QC xuất sau báo cáo xếp hàng và trước bàn giao/rời kho
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundQcRequest'
      responses:
        '200':
          description: Đã ghi QC xuất
        '409':
          description: Không được QC xuất hoặc QC thất bại
  /inter-warehouse-transfers/{id}/source-load-report:
    post:
      summary: Công nhân nguồn báo số lượng xếp trước QC xuất
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceLoadReportRequest'
      responses:
        '200':
          description: Đã ghi số lượng xếp tại nguồn
        '409':
          description: Không được báo xếp ở trạng thái hiện tại hoặc scope actor không hợp lệ
  /inter-warehouse-transfers/{id}/photo-evidence:
    post:
      summary: Upload ảnh bằng chứng đã chọn/chụp cho điều chuyển
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Ảnh bằng chứng được chọn từ thiết bị hoặc chụp bằng camera. UI nên nén ảnh camera lớn trước khi upload.
      responses:
        '200':
          description: Đã lưu ảnh và trả về mã tham chiếu ngắn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPhotoUploadResponse'
        '400':
          description: Thiếu file, file không phải ảnh hoặc ảnh vượt dung lượng
  /inter-warehouse-transfers/{id}/ship:
    post:
      summary: Thủ kho nguồn ghi đúng số lượng đã duyệt là số lượng gửi
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipTransferRequest'
      responses:
        '200':
          description: Đã ghi nhận ship
  /inter-warehouse-transfers/{id}/load-handover:
    post:
      summary: Thủ kho nguồn ghi bàn giao vật lý cho tài xế được gán
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
      responses:
        '200':
          description: Đã ghi bàn giao xếp hàng
  /inter-warehouse-transfers/{id}/unship:
    post:
      summary: Gỡ hàng trước khi tài xế rời kho và xóa số lượng đã gửi
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Đã gỡ hàng
  /inter-warehouse-transfers/{id}/depart:
    post:
      summary: Tài xế được gán xác nhận nhận hàng và rời kho
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Phiếu đã chuyển sang In-Transit
  /inter-warehouse-transfers/{id}/arrive:
    post:
      summary: Tài xế được gán ghi nhận đến kho nhận hiện tại
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
      responses:
        '200':
          description: Đã ghi nhận đến nơi
  /inter-warehouse-transfers/{id}/receiving-handover:
    post:
      summary: Kho nhận ghi bàn giao vật lý từ tài xế
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
      responses:
        '200':
          description: Đã ghi bàn giao khi đến; có thể bắt đầu receive-count
  /inter-warehouse-transfers/{id}/receive-count:
    put:
      summary: Công nhân kho đích ghi số lượng nhận ban đầu
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveCountRequest'
      responses:
        '200':
          description: Đã ghi receive count
  /inter-warehouse-transfers/{id}/receive-check:
    put:
      summary: Thủ kho kho đích kiểm count và ghi QC
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveCheckRequest'
      responses:
        '200':
          description: Đã duyệt receive check
  /inter-warehouse-transfers/{id}/final-receive:
    post:
      summary: Quản lý kho đích xác nhận nhận cuối
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveConfirmRequest'
      responses:
        '200':
          description: Hoàn tất hoặc hoàn tất có chênh lệch
  /inter-warehouse-transfers/{id}/return-to-source:
    post:
      summary: Actor phía nguồn có quyền yêu cầu quay đầu do quá hạn
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverdueReturnRequest'
      responses:
        '200':
          description: Đã duyệt quay đầu do quá hạn; tài xế phải chạy chặng quay đầu
        '409':
          description: Trip chưa quá hạn hoặc không được return
  /inter-warehouse-transfers/{id}/request-return:
    post:
      summary: Thủ kho kho đích báo sai SKU còn nguyên và yêu cầu quay về nguồn
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrongSkuReturnRequest'
      responses:
        '200':
          description: Đã gửi yêu cầu return cho quản lý kho đích xem xét
        '409':
          description: Không được yêu cầu return ở trạng thái hiện tại
  /inter-warehouse-transfers/{id}/approve-return:
    post:
      summary: Quản lý kho đích duyệt return sai SKU bằng cùng trip và tài xế
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Đã duyệt return; phạm vi nhận hàng chuyển về kho nguồn
        '403':
          description: Bắt buộc scope quản lý kho đích
        '409':
          description: Bắt buộc có yêu cầu return đang chờ
  /inter-warehouse-transfers/{id}/reject-return:
    post:
      summary: Quản lý kho đích từ chối yêu cầu return sai SKU
      tags: [Phiếu điều chuyển]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnDecisionRequest'
      responses:
        '200':
          description: Yêu cầu return bị từ chối kèm lý do
  /inter-warehouse-transfers/{id}/return-depart:
    post:
      summary: Tài xế được gán xác nhận rời kho nhận để quay đầu
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Đã ghi nhận rời điểm nhận để quay đầu
  /inter-warehouse-transfers/{id}/return-arrive:
    post:
      summary: Tài xế được gán ghi nhận về đến kho nguồn
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Đã ghi nhận về đến kho nguồn
  /inter-warehouse-transfers/{id}/quarantine-reject:
    post:
      summary: Thủ kho hoặc quản lý từ chối toàn bộ transfer và đưa vào quarantine
      tags: [Điều chuyển nội bộ]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineRejectRequest'
      responses:
        '200':
          description: Transfer đã chuyển vào quarantine
components:
  parameters:
    TransferRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TransferId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    CrossWarehouseStockResponse:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        warehouseCode: { type: string }
        totalQty: { type: number }
        reservedQty: { type: number }
        availableQty: { type: number }
        quarantineExcluded: { type: boolean }
    TransferRequestCreateRequest:
      type: object
      required: [requestingWarehouseId, sourceWarehouseId, neededByDate, businessReason, items]
      properties:
        requestingWarehouseId: { type: integer, format: int64 }
        sourceWarehouseId: { type: integer, format: int64 }
        neededByDate: { type: string, format: date }
        businessReason: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TransferRequestItemInput'
    TransferRequestItemInput:
      type: object
      required: [productId, requestedQty, observedSourceAvailableQty, observedRequestingAvailableQty]
      properties:
        id: { type: integer, format: int64, nullable: true }
        productId: { type: integer, format: int64 }
        requestedQty: { type: number, minimum: 0, exclusiveMinimum: true }
        observedSourceAvailableQty: { type: number }
        observedRequestingAvailableQty: { type: number }
        shortageReason: { type: string }
    CeoRejectTransferRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    TransferRequestResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        requestNumber: { type: string }
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CONVERTED, CANCELLED]
        requestingWarehouseId: { type: integer, format: int64 }
        sourceWarehouseId: { type: integer, format: int64 }
        neededByDate: { type: string, format: date }
        businessReason: { type: string }
        plannerAssigneeId: { type: integer, format: int64, nullable: true }
        convertedTransferId: { type: integer, format: int64, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferRequestItemResponse'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferRequestItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        requestedQty: { type: number }
        observedSourceAvailableQty: { type: number }
        observedRequestingAvailableQty: { type: number }
        shortageReason: { type: string, nullable: true }
    TransferCreateRequest:
      type: object
      required: [sourceWarehouseId, destinationWarehouseId, plannedDate, documentDate, externalInstructionCode, items]
      properties:
        sourceWarehouseId: { type: integer, format: int64 }
        destinationWarehouseId: { type: integer, format: int64 }
        plannedDate: { type: string, format: date }
        documentDate: { type: string, format: date }
        externalInstructionCode: { type: string, maxLength: 80 }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TransferItemInput'
    TransferUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TransferCreateRequest'
    TransferItemInput:
      type: object
      required: [productId, plannedQty]
      properties:
        id: { type: integer, format: int64, nullable: true }
        productId: { type: integer, format: int64 }
        plannedQty: { type: number, minimum: 0, exclusiveMinimum: true }
    RejectTransferRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    AssignTripRequest:
      type: object
      required: [vehicleId, driverId, plannedStartAt, plannedEndAt]
      properties:
        vehicleId: { type: integer, format: int64 }
        driverId: { type: integer, format: int64 }
        plannedStartAt: { type: string, format: date-time }
        plannedEndAt: { type: string, format: date-time }
        calculatedWeight: { type: number, readOnly: true }
        calculatedVolume: { type: number, readOnly: true }
    OutboundQcRequest:
      type: object
      required: [passed, photoRef]
      properties:
        passed: { type: boolean }
        note: { type: string }
        photoRef:
          type: string
          minLength: 1
          description: Mã tham chiếu ảnh ngắn trả về từ endpoint upload ảnh bằng chứng điều chuyển. Không gửi raw base64/data URL trong field này.
        items:
          type: array
          items:
            type: object
            required: [transferItemId, passed]
            properties:
              transferItemId: { type: integer, format: int64 }
