openapi: 3.0.3
info:
  title: Planner Delivery Order API
  version: 1.0.0
  description: Contracts for creating and cancelling outbound Delivery Orders in Sprint 1.
paths:
  /api/v1/delivery-orders:
    post:
      summary: Create Delivery Order after credit and warehouse stock validation
      operationId: createDeliveryOrder
      tags:
        - Delivery Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryOrderRequest"
      responses:
        "201":
          description: Delivery Order created in NEW status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrderResponse"
        "400":
          description: Invalid request payload, delivery date, duplicate item, or unsupported delivery order type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, expired, or invalid authentication token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Actor is not a Planner or Planner is not allowed to create for the selected warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Warehouse, dealer, or active product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Delivery order number, reservation, inventory version, concurrent modification, or data integrity conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Credit, dealer eligibility, price, accounting period, warehouse, or stock validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/delivery-orders/{id}/cancel:
    put:
      summary: Cancel Delivery Order before warehouse approval
      operationId: cancelDeliveryOrder
      tags:
        - Delivery Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDeliveryOrderRequest"
      responses:
        "200":
          description: Delivery Order cancelled and reservations released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrderResponse"
        "403":
          description: Actor is not Warehouse Manager for the DO warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Delivery Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reservation version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Delivery Order is WAREHOUSE_APPROVED or later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateDeliveryOrderRequest:
      type: object
      required:
        - dealerId
        - warehouseId
        - type
        - expectedDeliveryDate
        - documentDate
        - items
      properties:
        dealerId:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - SALE
          example: SALE
          description: Planner delivery-order creation only supports SALE.
        expectedDeliveryDate:
          type: string
          format: date
          description: Must be today or later and must not be before documentDate.
        documentDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateDeliveryOrderItemRequest"
    CreateDeliveryOrderItemRequest:
      type: object
      required:
        - productId
        - requestedQty
      properties:
        productId:
          type: integer
          format: int64
        requestedQty:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 10
    CancelDeliveryOrderRequest:
      type: object
      required:
        - cancelReason
      properties:
        cancelReason:
          type: string
          minLength: 1
          maxLength: 500
    DeliveryOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        doNumber:
          type: string
        dealerId:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        status:
          type: string
          example: NEW
        documentDate:
          type: string
          format: date
        expectedDeliveryDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryOrderItemResponse"
    DeliveryOrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        requestedQty:
          type: number
        reservedQty:
          type: number
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_REQUEST_BODY
            - INVALID_CREDENTIALS
            - ACCESS_DENIED
            - WAREHOUSE_SCOPE_FORBIDDEN
            - RESOURCE_NOT_FOUND
            - WAREHOUSE_INACTIVE
            - WAREHOUSE_TYPE_INVALID
            - DELIVERY_ORDER_TYPE_INVALID
            - INVALID_DELIVERY_DATE
            - BUSINESS_RULE_VIOLATION
            - MISSING_PRICE
            - CREDIT_HOLD
            - PERIOD_CLOSED
            - UNPROCESSABLE_ENTITY
            - INSUFFICIENT_STOCK
            - DUPLICATE_PRODUCT_ITEM
            - DELIVERY_ORDER_NUMBER_CONFLICT
            - INVENTORY_VERSION_CONFLICT
            - WAREHOUSE_PRODUCT_RESERVATION_CONFLICT
            - CONCURRENT_MODIFICATION
            - DATA_INTEGRITY_VIOLATION
            - DELIVERY_ORDER_CANCEL_FORBIDDEN
        message:
          type: string
        details:
          type: object
          additionalProperties: true
